version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20.19.0 || (nvm install 20.19.0 && nvm use 20.19.0)
        - npm ci
    build:
      commands:
        # Take vars from Amplify env and write them into Next.js env file
        - env | grep -e NOTION_KEY -e NOTION_DATABASE_ID >> .env.production
        - env | grep -e EMAIL_USER -e EMAIL_PASS -e EMAIL_FROM -e SMTP_HOST -e SMTP_PORT >> .env.production
        - env | grep -e RECAPTCHA_V3_SECRET_KEY >> .env.production
        - env | grep -e SLACK_BOT_TOKEN -e SLACK_SIGNING_SECRET -e SLACK_ADMIN_CHANNEL_ID >> .env.production
        - env | grep -e SQUARE_ACCESS_TOKEN -e SQUARE_LOCATION_ID -e SQUARE_WEBHOOK_SIGNATURE_KEY >> .env.production
        - env | grep -e GMAIL_CLIENT_ID -e GMAIL_CLIENT_SECRET >> .env.production
        - env | grep -e GOOGLE_REFRESH_TOKEN -e NOTION_PERFORMERS_DB_ID >> .env.production
        - env | grep -e PDF_SECRET -e ADMIN_SECRET >> .env.production
        - env | grep -e QSTASH_TOKEN -e QSTASH_CURRENT_SIGNING_KEY -e QSTASH_NEXT_SIGNING_KEY -e QSTASH_URL >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - NODE_OPTIONS=--max-old-space-size=4096 npm run build
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
